version: '3.8'
services:
    communication-app:
        image: xmonline/tmf-ms-communication:${IMAGE_TMF_MS_COMMUNICATION_TAG:-latest}
        # The image has no shell, runs as UID 65532 and writes only to /tmp.
        read_only: true
        cap_drop:
            - ALL
        volumes:
            # /tmp must be writable AND executable: Kafka's zstd/snappy codecs extract native
            # libraries there. A compose tmpfs mount is always noexec, so use a tmpfs-backed
            # local volume (mounted without noexec, discarded when the task stops).
            - type: volume
              source: communication-tmp
              target: /tmp
        networks:
            - xm2
        env_file:
            - ./env/communication-app.env
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: on-failure
        logging:
            driver: syslog
            options:
                tag: communication
                syslog-facility: local7

networks:
    xm2:
        driver: overlay

volumes:
    communication-tmp:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=64m,mode=1777,nosuid,nodev   # 64 MB: Tomcat work dir + native libs
